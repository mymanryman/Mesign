name: Bygg och deploya

on:
  pull_request:
  push:
    branches: [main]
  # Startas med "Run workflow" när nya ordlistor har sparats i appen.
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MESIGN_E00EB != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Tecknen hämtas från Svenskt teckenspråkslexikon och sparas i cachen. De fasta ämnena
      # hämtas bara om när ämneslistan eller importskripten ändras. Varje körning sparar en ny
      # cache, så att videor till egna ordlistor också återanvänds nästa gång.
      - name: Återanvänd hämtade tecken
        uses: actions/cache@v4
        with:
          path: |
            .import-cache
            public/media
          key: signs-${{ hashFiles('scripts/topics.json', 'scripts/lexicon.mjs', 'scripts/fetching.mjs', 'scripts/import-signs.mjs') }}-${{ github.run_id }}
          restore-keys: signs-${{ hashFiles('scripts/topics.json', 'scripts/lexicon.mjs', 'scripts/fetching.mjs', 'scripts/import-signs.mjs') }}-

      - name: Hämta fasta ämnen från lexikonet
        run: test -f .import-cache/base-catalog.json || npm run import-signs

      # Egna ordlistor läses från Firestore. Status skrivs bara tillbaka när bygget går live,
      # så att en förhandsvisning inte markerar listorna som klara.
      - name: Hämta egna ordlistor
        run: npm run import-wordlists
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MESIGN_E00EB }}
          WRITE_STATUS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_FIREBASE_SECRET == 'true' }}

      - run: npm run build

      - name: Förhandsvisning för pull request
        if: github.event_name == 'pull_request' && env.HAS_FIREBASE_SECRET == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MESIGN_E00EB }}
          projectId: mesign-e00eb
          expires: 7d

      - name: Deploya till produktion
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_FIREBASE_SECRET == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MESIGN_E00EB }}
          projectId: mesign-e00eb
          channelId: live
